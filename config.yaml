# Generated by wk-status-371tti-net.
server:
  name: status.371tti.net
  bind: 0.0.0.0
  port: 85

storage:
  path: data/records
  chunk_minutes: 5
  retention_days: 30

# Optional status messages; blank or omitted values use built-in defaults.
# status_messages:
#   operational: "All services are operational"
#   degraded: "Service performance is degraded"
#   incident: "Some services are experiencing issues"
#   outage: "All services are down"
#   checking: "Checking services"
#   no_services: "No services configured"
#   no_included_services: "No services included in status"

# Additional example monitors are commented out below.
# IDs sharing the same prefix before the final dot appear in one group.
# Optional `order` values put smaller numbers first; group order uses the lowest member value.
# Ordered groups come first, then unordered groups alphabetically. Other stays last.
# interval and timeout use seconds. slow_ms uses milliseconds (default 500; null disables it).
# Numeric response keys are graphed. `<group>.unit <text>` labels that graph group.
# IDs without a dot appear under "Other".
monitors:
  - id: web.371tti-net
    name: 371tti.net
    order: 10
    type: http
    url: https://371tti.net
    method: GET
    interval: 60
    timeout: 10
    slow_ms: 100
    status_codes: [200, 204]
    headers: {}

  - id: web.dev.371tti.net
    name: dev.371tti.net
    order: 20
    type: http
    url: https://dev.371tti.net
    method: GET
    interval: 60
    timeout: 10
    slow_ms: 100
    exclude_status: true
    status_codes: [200, 204]
    headers: {}

  - id: web.self.ping
    name: Status server
    order: 30
    type: http
    url: http://127.0.0.1:85/ping
    method: GET
    interval: 60
    timeout: 10
    slow_ms: 100
    status_codes: [200]
    headers: {}
    hide_target: true
    # /ping returns server.requests.unit requests and process.unit s for the metric graphs.

  - id: web.proxy-server
    name: web-proxy-server
    order: 40
    type: tcp
    host: 192.168.0.50
    port: 9791
    send: "METRICS\n"
    slow_ms: 500
    hide_target: true

# HTTP/S with key-value metrics in the response body:
#   - id: production.api
#     name: Production API
#     type: http
#     url: https://service.example/health
#     method: GET
#     interval: 60
#     timeout: 10
#     status_codes: [200, 204]
#     headers: {}
#     response_codes:
#       0: operational
#       1: degraded
#       2: down
#     # Example response lines: status.code 0, cpu.load 0.42, memory.bytes.used 536870912
#     # Add network.rx 1250000, network.tx 2340000, network.unit bytes/s for labeled graphs.
#
# ICMP Ping (grouped with production.api):
#   - id: production.database
#     name: Production Database Host
#     type: ping
#     host: 192.0.2.10
#     interval: 60
#     timeout: 5
#
# TCP port check (grouped with production.api):
#   - id: production.cache
#     name: Production Cache
#     type: tcp
#     host: cache.example
#     port: 6379
#     interval: 60
#     timeout: 5
#     slow_ms: 500
#     send: "STATUS\n"
#     # Stop reading at this marker; if omitted, read until the peer closes.
#     response_end: "\n"
#     # Maximum captured response size in bytes (default 16384, maximum 65536).
#     max_bytes: 16384
#     # Map status.code values to a service status; unknown codes are Down.
#     response_codes:
#       0: operational
#       1: degraded
#       2: down
#
# Linux metrics agent (TCP, default port 9791; replace the host and token):
#   - id: production.host
#     name: Production Host
#     type: tcp
#     host: 192.0.2.50
#     port: 9791
#     interval: 60
#     timeout: 5
#     slow_ms: 500
#     send: "METRICS <token>\n"
#     # The agent returns grouped metrics such as cpu.percent.all,
#     # cpu.percent.0, memory.bytes.used, and network.bytes.rx.<interface>.
#     response_codes:
#       0: operational
#       1: degraded
#       2: down
