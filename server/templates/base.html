<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} · {{ app_name }}</title>
  <style>{% include "style.css" %}</style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">{{ app_name }}</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <div id="point-tooltip" class="point-tooltip" role="tooltip" hidden></div>
  {% block page_scripts %}{% endblock %}
  <script>
    (() => {
      const tooltip = document.getElementById("point-tooltip");
      const selector = "[data-tooltip], [title]";
      let activeTarget = null;
      let pinned = false;

      document.querySelectorAll("[title]").forEach((element) => {
        if (!element.hasAttribute("data-tooltip")) {
          element.dataset.tooltip = element.getAttribute("title") || "";
        }
        element.removeAttribute("title");
      });

      const targetFromEvent = (event) => {
        if (!(event.target instanceof Element)) return null;
        const target = event.target.closest(selector);
        if (target) return target;

        const bar = event.target.closest(".uptime-bar");
        if (!bar) return null;
        const segments = bar.querySelectorAll(".uptime-segment");
        const bounds = bar.getBoundingClientRect();
        if (!segments.length || bounds.width <= 0) return null;
        const position = Math.max(0, Math.min(0.999999, (event.clientX - bounds.left) / bounds.width));
        return segments[Math.floor(position * segments.length)];
      };

      const hideTooltip = () => {
        if (activeTarget) activeTarget.removeAttribute("aria-describedby");
        tooltip.hidden = true;
        tooltip.replaceChildren();
        tooltip.classList.remove("metric-tooltip");
        tooltip.style.removeProperty("width");
        activeTarget = null;
        pinned = false;
      };

      const positionTooltip = (x, y) => {
        const gap = 12;
        const bounds = tooltip.getBoundingClientRect();
        let left = x + gap;
        let top = y - bounds.height - gap;
        if (top < 8) top = y + gap;
        left = Math.max(8, Math.min(left, window.innerWidth - bounds.width - 8));
        top = Math.max(8, Math.min(top, window.innerHeight - bounds.height - 8));
        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
      };

      const showTooltip = (target, x, y) => {
        const message = target.dataset.tooltip || target.getAttribute("title");
        if (!message) return;
        if (activeTarget !== target && activeTarget) {
          activeTarget.removeAttribute("aria-describedby");
        }
        activeTarget = target;
        target.setAttribute("aria-describedby", "point-tooltip");
        tooltip.classList.remove("metric-tooltip");
        tooltip.style.removeProperty("width");
        tooltip.textContent = message;
        tooltip.hidden = false;
        positionTooltip(x, y);
      };

      document.addEventListener("pointerover", (event) => {
        if (event.pointerType === "touch") return;
        const target = targetFromEvent(event);
        if (target) showTooltip(target, event.clientX, event.clientY);
      });

      document.addEventListener("pointermove", (event) => {
        if (event.pointerType === "touch" || pinned || !activeTarget) return;
        positionTooltip(event.clientX, event.clientY);
      });

      document.addEventListener("pointerout", (event) => {
        if (event.pointerType === "touch" || pinned) return;
        const target = targetFromEvent(event);
        if (target && target === activeTarget && !target.contains(event.relatedTarget)) {
          hideTooltip();
        }
      });

      document.addEventListener("focusin", (event) => {
        const target = targetFromEvent(event);
        if (!target) return;
        const bounds = target.getBoundingClientRect();
        showTooltip(target, bounds.left + bounds.width / 2, bounds.top);
      });

      document.addEventListener("focusout", (event) => {
        const target = targetFromEvent(event);
        if (target && target === activeTarget && !pinned) hideTooltip();
      });

      document.addEventListener("click", (event) => {
        const target = targetFromEvent(event);
        if (target) {
          pinned = true;
          const bounds = target.getBoundingClientRect();
          showTooltip(target, bounds.left + bounds.width / 2, bounds.top);
        } else if (activeTarget) {
          hideTooltip();
        }
      });

      document.querySelectorAll(".monitor-card[data-detail-href]").forEach((card) => {
        card.addEventListener("click", (event) => {
          const clickedElement = event.target instanceof Element ? event.target : null;
          if (event.defaultPrevented || clickedElement?.closest("a, button, input, select, textarea, summary")) return;
          if (event.button !== 0 || window.getSelection()?.toString()) return;
          window.location.assign(card.dataset.detailHref);
        });
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") hideTooltip();
      });

      document.addEventListener("scroll", () => {
        if (activeTarget) hideTooltip();
      }, true);

    })();
  </script>
  <script src="/assets/status-updates.js"></script>
</body>
</html>
